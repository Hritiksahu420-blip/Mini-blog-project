{% extends "base.html" %}
{% block title %}Sign up · MiniBlog{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="auth-card">
  <p class="eyebrow">GET STARTED</p><h1>Create your account</h1><p class="muted">Join the conversation and share your ideas.</p>
  <form method="post" class="form">
    <label for="username">Username</label><input id="username" name="username" required minlength="3" maxlength="30" autocomplete="username" placeholder="Choose a username">
    <label for="password">Password</label><input id="password" name="password" type="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters">
    <button class="button full" type="submit">Create account</button>
  </form>
  <p class="auth-foot">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</div></div>
{% endblock %}
