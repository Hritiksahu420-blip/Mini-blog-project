{% extends "base.html" %}
{% block title %}Log in · MiniBlog{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="auth-card">
  <p class="eyebrow">WELCOME BACK</p><h1>Log in</h1><p class="muted">Pick up where you left off.</p>
  <form method="post" class="form">
    <label for="username">Username</label><input id="username" name="username" required autocomplete="username" placeholder="Your username">
    <label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password" placeholder="Your password">
    <button class="button full" type="submit">Log in</button>
  </form>
  <p class="auth-foot">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div></div>
{% endblock %}
